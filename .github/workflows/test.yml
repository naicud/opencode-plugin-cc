name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash expands the tests/*.test.mjs glob in the npm test script;
        # PowerShell (the Windows default) would pass it through literally.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Syntax check all plugin scripts
        if: runner.os != 'Windows'
        run: |
          find plugins -name '*.mjs' -print0 | xargs -0 -n1 node --check

  windows-smoke:
    # Real-binary smoke on Windows: boots the MCP server over stdio with the
    # actual opencode CLI installed, verifies handshake + 11 tools + doctor
    # (binary discovery + state dir). Unit matrix alone never exercises this.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install opencode CLI
        run: npm i -g opencode-ai
      - name: MCP stdio smoke against the real binary
        run: node plugins/opencode/scripts/windows-smoke.mjs
